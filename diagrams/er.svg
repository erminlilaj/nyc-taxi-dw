<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">NYC Taxi PostgreSQL Star Schema</title>
  <desc id="desc">Entity relationship diagram for fact_trip and its five dimensions.</desc>
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #172033; }
      .subtitle { font-family: Arial, sans-serif; font-size: 18px; fill: #526172; }
      .head { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #172033; }
      .key { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #172033; }
      .field { font-family: Arial, sans-serif; font-size: 15px; fill: #243145; }
      .note { font-family: Arial, sans-serif; font-size: 14px; fill: #526172; }
      .link { stroke: #475569; stroke-width: 2.4; fill: none; }
    </style>
  </defs>
  <rect width="1500" height="980" fill="#f8fafc"/>
  <text x="70" y="72" class="title">NYC Taxi Data Warehouse: PostgreSQL Star Schema</text>
  <text x="70" y="106" class="subtitle">Physical table names and foreign-key relationships</text>

  <path class="link" d="M 450 270 L 586 365"/>
  <path class="link" d="M 1050 270 L 914 365"/>
  <path class="link" d="M 1050 715 L 914 610"/>
  <path class="link" d="M 450 715 L 586 610"/>
  <path class="link" d="M 450 485 L 586 485"/>

  <g transform="translate(100 145)">
    <rect width="350" height="180" rx="8" fill="#d9f5ef" stroke="#159a8a" stroke-width="2"/>
    <text x="20" y="34" class="head">dim_time</text>
    <line x1="0" y1="52" x2="350" y2="52" stroke="#159a8a"/>
    <text x="20" y="80" class="key">PK  time_id</text>
    <text x="20" y="107" class="field">pickup_date, year, quarter, month</text>
    <text x="20" y="134" class="field">day, hour, day_of_week, is_weekend</text>
    <text x="20" y="162" class="note">unique: pickup_date + hour</text>
  </g>

  <g transform="translate(1050 145)">
    <rect width="350" height="195" rx="8" fill="#e1edff" stroke="#3976c5" stroke-width="2"/>
    <text x="20" y="34" class="head">dim_pickup_location</text>
    <line x1="0" y1="52" x2="350" y2="52" stroke="#3976c5"/>
    <text x="20" y="80" class="key">PK  location_id</text>
    <text x="20" y="107" class="field">zone, borough, city</text>
    <text x="20" y="145" class="note">one row per TLC pickup zone</text>
  </g>

  <g transform="translate(1050 650)">
    <rect width="350" height="195" rx="8" fill="#fff0d9" stroke="#ca7b17" stroke-width="2"/>
    <text x="20" y="34" class="head">dim_dropoff_location</text>
    <line x1="0" y1="52" x2="350" y2="52" stroke="#ca7b17"/>
    <text x="20" y="80" class="key">PK  location_id</text>
    <text x="20" y="107" class="field">zone, borough, city</text>
    <text x="20" y="145" class="note">one row per TLC dropoff zone</text>
  </g>

  <g transform="translate(100 660)">
    <rect width="350" height="170" rx="8" fill="#ffe4e1" stroke="#d95d50" stroke-width="2"/>
    <text x="20" y="34" class="head">dim_payment</text>
    <line x1="0" y1="52" x2="350" y2="52" stroke="#d95d50"/>
    <text x="20" y="80" class="key">PK  payment_id</text>
    <text x="20" y="107" class="field">payment_type, payment_category</text>
  </g>

  <g transform="translate(100 410)">
    <rect width="350" height="165" rx="8" fill="#ede5ff" stroke="#8560bd" stroke-width="2"/>
    <text x="20" y="34" class="head">dim_service</text>
    <line x1="0" y1="52" x2="350" y2="52" stroke="#8560bd"/>
    <text x="20" y="80" class="key">PK  service_id</text>
    <text x="20" y="107" class="field">vendor_id, vendor_name, service_type</text>
  </g>

  <g transform="translate(586 300)">
    <rect width="328" height="390" rx="8" fill="#ffffff" stroke="#172033" stroke-width="3"/>
    <rect width="328" height="58" rx="8" fill="#172033"/>
    <text x="20" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">fact_trip</text>
    <text x="20" y="88" class="key">PK  trip_id</text>
    <text x="20" y="118" class="key">FK  time_id</text>
    <text x="20" y="146" class="key">FK  pickup_location_id</text>
    <text x="20" y="174" class="key">FK  dropoff_location_id</text>
    <text x="20" y="202" class="key">FK  payment_id</text>
    <text x="20" y="230" class="key">FK  service_id</text>
    <line x1="20" y1="250" x2="308" y2="250" stroke="#cbd5e1"/>
    <text x="20" y="280" class="field">fare_amount, tip_amount, total_amount</text>
    <text x="20" y="308" class="field">trip_distance, passenger_count</text>
    <text x="20" y="336" class="field">trip_duration</text>
    <text x="20" y="370" class="note">grain: one cleaned taxi trip</text>
  </g>

  <text x="70" y="925" class="note">All dimension relationships are one-to-many: each fact row references exactly one row in each dimension.</text>
</svg>
