<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">NYC Taxi Dimensional Fact Model</title>
  <desc id="desc">FactTrip with time, pickup location, dropoff location, payment, and service dimensions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #172033; }
      .subtitle { font-family: Arial, sans-serif; font-size: 18px; fill: #526172; }
      .card-title { font-family: Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #172033; }
      .field { font-family: Arial, sans-serif; font-size: 16px; fill: #243145; }
      .small { font-family: Arial, sans-serif; font-size: 14px; fill: #526172; }
      .line { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="900" fill="#f8fafc"/>
  <text x="70" y="72" class="title">NYC Taxi Data Warehouse: Dimensional Fact Model</text>
  <text x="70" y="106" class="subtitle">Grain: one cleaned Yellow Taxi trip, January-March 2024</text>

  <path class="line" d="M 355 218 C 450 235, 470 300, 520 355"/>
  <path class="line" d="M 1030 244 C 955 260, 930 310, 878 362"/>
  <path class="line" d="M 1030 645 C 950 635, 930 602, 878 565"/>
  <path class="line" d="M 370 684 C 450 660, 470 622, 520 573"/>
  <path class="line" d="M 356 480 L 518 480"/>

  <g transform="translate(70 145)">
    <rect width="285" height="150" rx="8" fill="#d9f5ef" stroke="#159a8a" stroke-width="2"/>
    <text x="22" y="38" class="card-title">DimTime</text>
    <text x="22" y="70" class="field">Hour -&gt; Day -&gt; Month</text>
    <text x="22" y="96" class="field">-&gt; Quarter -&gt; Year</text>
    <text x="22" y="128" class="small">pickup date, hour, weekday</text>
  </g>

  <g transform="translate(1030 150)">
    <rect width="300" height="185" rx="8" fill="#e1edff" stroke="#3976c5" stroke-width="2"/>
    <text x="22" y="38" class="card-title">DimPickupLocation</text>
    <text x="22" y="73" class="field">Zone -&gt; Borough -&gt; City</text>
    <text x="22" y="108" class="small">pickup location ID</text>
    <text x="22" y="137" class="small">zone, borough, city</text>
  </g>

  <g transform="translate(1030 572)">
    <rect width="300" height="185" rx="8" fill="#fff0d9" stroke="#ca7b17" stroke-width="2"/>
    <text x="22" y="38" class="card-title">DimDropoffLocation</text>
    <text x="22" y="73" class="field">Zone -&gt; Borough -&gt; City</text>
    <text x="22" y="108" class="small">dropoff location ID</text>
    <text x="22" y="137" class="small">zone, borough, city</text>
  </g>

  <g transform="translate(70 625)">
    <rect width="300" height="145" rx="8" fill="#ffe4e1" stroke="#d95d50" stroke-width="2"/>
    <text x="22" y="38" class="card-title">DimPayment</text>
    <text x="22" y="73" class="field">Payment Type -&gt; Category</text>
    <text x="22" y="108" class="small">payment code and type</text>
  </g>

  <g transform="translate(70 410)">
    <rect width="285" height="140" rx="8" fill="#ede5ff" stroke="#8560bd" stroke-width="2"/>
    <text x="22" y="38" class="card-title">DimService</text>
    <text x="22" y="73" class="field">Vendor -&gt; Taxi Service Type</text>
    <text x="22" y="108" class="small">vendor ID and name</text>
  </g>

  <g transform="translate(520 325)">
    <rect width="358" height="290" rx="8" fill="#ffffff" stroke="#172033" stroke-width="3"/>
    <rect width="358" height="62" rx="8" fill="#172033"/>
    <text x="22" y="40" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">FactTrip</text>
    <text x="22" y="96" class="small">Foreign keys</text>
    <text x="22" y="124" class="field">time, pickup, dropoff, payment, service</text>
    <line x1="22" y1="144" x2="336" y2="144" stroke="#cbd5e1"/>
    <text x="22" y="174" class="small">Measures</text>
    <text x="22" y="202" class="field">fare amount, total amount, tip amount</text>
    <text x="22" y="230" class="field">trip distance, passenger count</text>
    <text x="22" y="258" class="field">trip duration</text>
  </g>

  <text x="70" y="845" class="small">The physical PostgreSQL schema is a star schema. Dimension hierarchies support roll-up and drill-down OLAP analysis.</text>
</svg>
