services:
  postgres:
    image: postgres:16
    container_name: nyc_taxi_postgres
    environment:
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: taxi
      POSTGRES_DB: nyc_taxi_dw
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: nyc_taxi_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    container_name: nyc_taxi_neo4j
    environment:
      NEO4J_AUTH: neo4j/taxigraph2024
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "true"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
      - ./neo4j/import:/import:ro
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
